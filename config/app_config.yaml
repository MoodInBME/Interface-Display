# Konfigurasi non-rahasia. Rahasia (password, path cert) ada di .env.
app:
  display_mode: kiosk          # kiosk | windowed
  resolution:
    width: 1024                # Waveshare 10.1" IPS (Tabel 1)
    height: 600
  idle_timeout_seconds: 45     # kembali ke IdleMirror setelah tidak ada interaksi
  presence_grace_seconds: 8    # tunggu sebelum anggap user pergi

capture:
  min_window_seconds: 30       # W5: STC-rPPG butuh >=30s / 900 frame @30fps
  target_fps: 30
  countdown_seconds: 3
  # gate mutu sinyal sebelum inferensi dianggap valid
  min_signal_quality: 0.6      # 0..1, dari topik moodin/signal/quality

mood:
  # 5 kelas sesuai proposal (kuadran valence-arousal)
  classes:
    - id: ceria
      label: "Ceria"
      quadrant: Q1
    - id: cemas
      label: "Cemas"
      quadrant: Q2
    - id: tertekan
      label: "Tertekan"
      quadrant: Q3
    - id: rileks
      label: "Rileks"
      quadrant: Q4
    - id: netral
      label: "Netral"
      quadrant: center

mqtt:
  keepalive_seconds: 30
  reconnect_min_delay: 1
  reconnect_max_delay: 30
  qos: 1

trends:
  history_days: 7              # TrendsScreen menampilkan 7 hari terakhir
